<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 560 380' width='560' height='380' role='img' aria-label='A 10-foot ladder leans against a wall. Its foot is x feet from the wall and slides away at 1 foot per second; its top is y feet up the wall and slides down at an unknown rate. The sides satisfy x squared plus y squared equals 100.'>
<rect width='560' height='380' fill='#fff'/>

<rect x='140' y='40' width='30' height='260' fill='#e9edf5' stroke='#5b6880'/>
<line x1='140' x2='530' y1='300' y2='300' stroke='#5b6880' stroke-width='2'/>
<line x1='170' y1='76' x2='338' y2='300' stroke='#6654e8' stroke-width='8' stroke-linecap='round'/>
<path d='M170,282 h18 v18' fill='none' stroke='#5b6880' stroke-width='1.5'/>
<text x='268.0' y='180.0' font-size='18' font-weight='700' fill='#6654e8' font-family='Figtree, system-ui, sans-serif'>10 ft</text>
<text x='254.0' y='326' text-anchor='middle' font-size='18' font-weight='700' fill='#17233b' font-family='Figtree, system-ui, sans-serif'>x</text>
<text x='128' y='188.0' text-anchor='end' font-size='18' font-weight='700' fill='#17233b' font-family='Figtree, system-ui, sans-serif'>y</text>
<line x1='352' x2='408' y1='286' y2='286' stroke='#e0742c' stroke-width='3'/>
<polygon points='416,286 404,280 404,292' fill='#e0742c'/>
<text x='356' y='274' font-size='15' font-weight='700' fill='#e0742c' font-family='Figtree, system-ui, sans-serif'>dx/dt = 1 ft/s</text>
<line x1='122' x2='122' y1='86' y2='136' stroke='#0e9f9a' stroke-width='3'/>
<polygon points='122,144 116,132 128,132' fill='#0e9f9a'/>
<text x='112' y='122' text-anchor='end' font-size='15' font-weight='700' fill='#0e9f9a' font-family='Figtree, system-ui, sans-serif'>dy/dt = ?</text>
<text x='280.0' y='352' text-anchor='middle' font-size='15' fill='#17233b' font-family='Figtree, system-ui, sans-serif'>x² + y² = 10² at every instant</text>

</svg>
